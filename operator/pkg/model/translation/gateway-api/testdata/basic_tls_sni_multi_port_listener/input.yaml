  name: tls-6443
  port: 6443
  routes:
  - backends:
    - name: backend-one
      namespace: default
      port:
        port: 6443
    hostnames:
    - foo.com
  sources:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: my-gateway
    namespace: default
    version: v1
- hostname: foo.com
  name: tls-8443
  port: 8443
